<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MentorMates product preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1680" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="120" y="110" width="1360" height="780" rx="28" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="120" y="110" width="1360" height="70" rx="28" fill="#F8FAFC"/>
    <path d="M120 180H1480" stroke="#0F172A" stroke-opacity="0.10" stroke-width="2"/>

    <!-- Window dots -->
    <circle cx="170" cy="145" r="9" fill="#F87171"/>
    <circle cx="202" cy="145" r="9" fill="#FBBF24"/>
    <circle cx="234" cy="145" r="9" fill="#34D399"/>

    <!-- Top right pill -->
    <rect x="1310" y="128" width="140" height="34" rx="17" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.10" stroke-width="2"/>

    <!-- Sidebar -->
    <rect x="150" y="210" width="320" height="650" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.10" stroke-width="2"/>
    <rect x="178" y="238" width="160" height="28" rx="10" fill="#3B82F6" fill-opacity="0.10"/>
    <rect x="178" y="284" width="250" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="178" y="316" width="230" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="178" y="348" width="240" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="178" y="380" width="210" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="178" y="412" width="220" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>

    <!-- Main -->
    <rect x="500" y="210" width="950" height="650" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.10" stroke-width="2"/>
    <rect x="532" y="242" width="886" height="180" rx="18" fill="url(#hero)" stroke="#0F172A" stroke-opacity="0.08" stroke-width="2"/>

    <!-- Title + blurb -->
    <rect x="532" y="452" width="320" height="26" rx="13" fill="#0F172A" fill-opacity="0.10"/>
    <rect x="532" y="492" width="520" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="532" y="520" width="460" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="532" y="566" width="360" height="44" rx="22" fill="#3B82F6"/>

    <!-- Right card -->
    <rect x="1080" y="452" width="338" height="240" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.10" stroke-width="2"/>
    <rect x="1106" y="478" width="160" height="20" rx="10" fill="#0F172A" fill-opacity="0.10"/>
    <rect x="1106" y="520" width="286" height="38" rx="12" fill="#0F172A" fill-opacity="0.06"/>
    <rect x="1106" y="568" width="286" height="38" rx="12" fill="#0F172A" fill-opacity="0.06"/>
    <rect x="1106" y="616" width="286" height="38" rx="12" fill="#0F172A" fill-opacity="0.06"/>

    <!-- Tabs row -->
    <rect x="532" y="648" width="220" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="770" y="648" width="220" height="18" rx="9" fill="#0F172A" fill-opacity="0.06"/>
    <rect x="1008" y="648" width="220" height="18" rx="9" fill="#0F172A" fill-opacity="0.06"/>

    <!-- Content blocks -->
    <rect x="532" y="700" width="420" height="18" rx="9" fill="#0F172A" fill-opacity="0.08"/>
    <rect x="532" y="730" width="600" height="18" rx="9" fill="#0F172A" fill-opacity="0.06"/>
    <rect x="532" y="760" width="560" height="18" rx="9" fill="#0F172A" fill-opacity="0.06"/>
  </g>

  <!-- Overlay label -->
  <g>
    <rect x="120" y="910" width="1360" height="52" rx="20" fill="#0F172A" fill-opacity="0.04"/>
    <text x="800" y="944" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="18" fill="#0F172A" fill-opacity="0.55">
      Replace with a real product screenshot
    </text>
  </g>
</svg>

