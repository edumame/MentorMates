<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="640" y1="200" x2="640" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB3C7"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="24" fill="url(#bgGrad)"/>

  <g filter="url(#softShadow)">
    <path d="M640 540C520 460 420 360 440 260C460 180 560 160 640 240C720 160 820 180 840 260C860 360 760 460 640 540Z"
          fill="url(#heartGrad)" stroke="white" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <g>
    <text x="640" y="620" text-anchor="middle" font-size="64" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-weight="700" fill="white">Lovable Setup</text>
    <text x="640" y="668" text-anchor="middle" font-size="28" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-weight="500" fill="rgba(255,255,255,0.9)">Go-To-Market Hackathon</text>
  </g>

  <rect x="32" y="32" width="1216" height="656" rx="20" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
